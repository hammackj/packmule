# Push a tag like v0.1.0 (matching package.json's version) to build the Linux
# packages and publish them as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # bsdtar builds the pacman package.
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
