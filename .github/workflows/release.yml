# Push a tag like v0.2.0 (matching app/Cargo.toml's version) to build the
# Linux packages and publish them as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04 so the binary runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but app/Cargo.toml says $version"; exit 1; }

      - run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libxcb1-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libarchive-tools zstd
      - name: Bundle the current catalog
        run: curl -fsSL https://raw.githubusercontent.com/hammackj/packmule-catalog/main/catalog.json -o catalog.json
      - run: cargo test --locked -p packmule
      - run: cargo build --release --locked -p packmule-app
      - run: packaging/build-packages.sh target/release/packmule dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Packmule ${GITHUB_REF_NAME#v}" --generate-notes

  # Updates packmule-bin on the AUR. Needs the AUR_SSH_KEY secret: the private
  # key of an SSH key added to the AUR maintainer account (skipped without it).
  aur:
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish packmule-bin
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_NAME: ${{ github.repository_owner }}
          AUR_EMAIL: ${{ github.repository_owner }}@users.noreply.github.com
        run: |
          if [ -z "$AUR_SSH_KEY" ]; then echo "No AUR_SSH_KEY secret; skipping the AUR"; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur && chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n' >> ~/.ssh/config
          packaging/aur/publish.sh "$GITHUB_REF_NAME" --push
