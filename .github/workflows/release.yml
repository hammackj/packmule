# Push a tag like v0.2.0 (matching app/Cargo.toml's version) to build the
# Linux packages and publish them as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    # Ubuntu 22.04 so the binary runs on glibc 2.35 and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' app/Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but app/Cargo.toml says $version"; exit 1; }

      - run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libxcb1-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libarchive-tools zstd
      - run: cargo test --locked -p packmule
      - run: cargo build --release --locked -p packmule-app
      - run: packaging/build-packages.sh target/release/packmule dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "Packmule ${GITHUB_REF_NAME#v}" --generate-notes
