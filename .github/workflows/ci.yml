# Tests the core, and builds the app and its Linux packages (as artifacts).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The core only: the app needs the Linux graphics headers (see `package`).
      - run: cargo fmt --all --check
      - run: cargo clippy -p packmule --all-targets -- -D warnings
      - run: cargo test -p packmule

  # Ubuntu 22.04 so the binary runs on glibc 2.35 and newer.
  package:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libxcb1-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libarchive-tools zstd
      - run: cargo clippy -p packmule-app --locked -- -D warnings
      - run: cargo build --release --locked -p packmule-app
      - run: packaging/build-packages.sh target/release/packmule dist
      - uses: actions/upload-artifact@v7
        with:
          name: packmule-linux
          path: dist/*
          if-no-files-found: error
