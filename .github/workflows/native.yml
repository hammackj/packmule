# Tests the native (Rust) rebuild in native/.
name: Native

on:
  push:
    paths: ['native/**', 'catalog.json', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'catalog.json', '.github/workflows/native.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      # The core only: the GPUI app needs the Linux graphics headers (phase 3).
      - run: cargo fmt --all --check
      - run: cargo clippy -p packmule --all-targets -- -D warnings
      - run: cargo test -p packmule

  # Builds the app and its Linux packages; uploaded as workflow artifacts.
  # Ubuntu 22.04 so the binary runs on glibc 2.35 and newer.
  package:
    runs-on: ubuntu-22.04
    needs: test
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: >
          sudo apt-get update && sudo apt-get install -y pkg-config libxcb1-dev libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libarchive-tools zstd
      - run: cargo build --release --locked -p packmule-app
      - run: packaging/build-packages.sh target/release/packmule dist
      - uses: actions/upload-artifact@v4
        with:
          name: packmule-linux
          path: native/dist/*
          if-no-files-found: error
