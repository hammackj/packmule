# Tests the native (Rust) rebuild in native/.
name: Native

on:
  push:
    paths: ['native/**', 'catalog.json', '.github/workflows/native.yml']
  pull_request:
    paths: ['native/**', 'catalog.json', '.github/workflows/native.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
