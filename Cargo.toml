[package]
name = "packmule"
version = "0.2.1"
edition = "2024"
description = "World of Warcraft addon manager that installs and updates addons from their GitHub releases"
license = "MIT"
repository = "https://github.com/hammackj/packmule"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
directories = "6.0.0"
flate2 = "1.1.11"
keyring = "4.2.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
ureq = "3.5.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }


[workspace]
members = [".", "app"]

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
